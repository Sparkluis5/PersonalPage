const ext = href => href.startsWith('http') ? ' target="_blank" rel="noopener"' : '';

const chips = (cls, list) => list?.length ? `<p class="${cls}">${list.map(t => `<span>${t}</span>`).join('')}</p>` : '';
const podium = place => `<div class="podium" data-r style="--r:4" aria-hidden="true">${[2, 1, 3].map((n, i) => `<b${n === place ? ' class="me"' : ''} style="height:${112 - 24 * n}px;--i:${i}">${n === place ? '<span class="logo">LD</span>' : ''}${n}</b>`).join('')}</div>`;

const station = (s, i) => `<section class="slide station" aria-label="${s.year}, ${s.name}">
  <span class="arc tr" aria-hidden="true"></span>
  <div class="st-grid">
    <div class="totem" data-r style="--r:0">
      <p class="totem-top"><span class="logo" aria-hidden="true">LD</span><span>${s.when.endsWith('Present') ? 'Hoje · Now' : `Estação ${pad(i + 1)}`}</span></p>
      <p class="totem-name">${s.name}</p>
      <p class="pills">${s.lines.map(l => `<span style="--c:var(--${l})">${LINES[l]}</span>`).join('')}</p>
      <p class="led"><span>${s.year}</span><span>▸ ${STOPS[i + 1].name}</span></p>
    </div>
    <div>
      <h2 data-r style="--r:1">${s.title}</h2>
      <p class="org" data-r style="--r:2">${s.org} · ${s.when}</p>
      <ul class="points" data-r style="--r:3">${s.points.map(p => `<li>${p}</li>`).join('')}</ul>
      ${s.stats ? `<ul class="stats" data-r style="--r:4">${s.stats.map(([v, k]) => `<li><b>${v}</b><span>${k}</span></li>`).join('')}</ul>` : ''}
      ${s.tags ? `<div data-r style="--r:4">${chips('tags', s.tags)}</div>` : ''}
      ${s.podium ? podium(s.podium) : ''}
    </div>
  </div>
</section>`;

const site = () => `<main class="site" tabindex="-1">
  <header class="bar">
    <span class="logo" aria-hidden="true">LD</span>
    <div class="rail" style="--p:0">
      ${STOPS.slice(1).map((s, j) => `<span class="seg${s.planned ? ' plan' : ''}" style="left:${j / (N - 1) * 100}%;width:${100 / (N - 1)}%;--c:var(--${s.lines[0]})"></span>`).join('')}
      ${STOPS.map((s, i) => `<button class="stop" data-go="${i + 1}" style="left:${i / (N - 1) * 100}%" title="${s.year} · ${s.name}" aria-label="Go to ${s.year}, ${s.name}"></button>`).join('')}
      <span class="train" aria-hidden="true"><span class="bus"><i></i><i></i></span></span>
    </div>
    <p class="display" aria-live="polite"><span class="dk">Próxima estação</span><span class="dv">${STOPS[0].name}</span></p>
  </header>
  <div class="deck">
    <section class="slide" aria-label="Introduction">
      <span class="arcs" aria-hidden="true"><span class="arc tr"></span><span class="arc bl"></span></span>
      <div class="cover-grid">
        <div>
          <p class="kicker" data-r style="--r:0">Coimbra, Portugal</p>
          <h1 data-r style="--r:1"><span>Luis</span><span>Duarte</span></h1>
          <p class="lede" data-r style="--r:2">GenAI engineer. I build AI agents that do real work in production.</p>
          <p class="text" data-r style="--r:3">${ME.bio}</p>
          <button class="board" data-go="1" data-r style="--r:4">Embarcar em ${STOPS[0].name} <span aria-hidden="true">→</span></button>
          <p class="how" data-r style="--r:5">Scroll, swipe or press ↓ — ${RIDE.length} stations, one line.</p>
        </div>
        <div class="panel" data-r style="--r:3">
          <p class="panel-h"><span>Partidas · Departures</span><span class="clock">--:--</span></p>
          <ol class="dep">${RIDE.map((s, i) => `<li style="--c:var(--${s.lines[0]});--i:${i}"><i></i><span>${s.name}</span><b>${s.year}</b></li>`).join('')}</ol>
        </div>
      </div>
    </section>
    ${RIDE.map(station).join('')}
    <section class="slide end" aria-label="Contact">
      <span class="arc tr" aria-hidden="true"></span>
      <div class="end-grid">
        <div>
          <p class="kicker" data-r style="--r:0">Fim de linha · Terminal</p>
          <h2 data-r style="--r:1">next stop:<br>let’s talk.</h2>
          <p class="text" data-r style="--r:2">Building AI agents, RAG systems or LLM products that have to hold up in production? I’m always happy to talk architecture, collaborate, or compare notes.</p>
          <ul class="links" data-r style="--r:3">${CONTACT.map(([k, v, href], i) => `<li style="--c:var(--${COLS[i]})"><span class="k">${k}</span><a href="${href}"${ext(href)}>${v}</a><span class="arrow" aria-hidden="true">→</span></li>`).join('')}</ul>
          <p class="notice" data-r style="--r:4"><b>AVISO</b><span>Not affiliated with Metro Mondego — Yes, I themed my entire CV after a metrobus line, please don't judge me :)</span></p>
        </div>
        <div class="panel" data-r style="--r:3">
          <p class="panel-h"><span>Rede · Stack</span></p>
          <ul class="stack">${STACK.map(([g, c, list]) => `<li style="--c:var(--${c})"><b>${g}</b>${chips('', list.split(' · '))}</li>`).join('')}</ul>
        </div>
      </div>
    </section>
  </div>
  <nav class="ctrl" aria-label="Journey controls"><button data-step="-1" aria-label="Previous station">↑</button><span class="count">01 / ${N + 1}</span><button data-step="1" aria-label="Next station">↓</button></nav>
</main>`;

function initDeck(root) {
  const deck = root.querySelector('.deck'), slides = [...deck.children], last = slides.length - 1;
  const rail = root.querySelector('.rail'), segs = rail.querySelectorAll('.seg'), stops = rail.querySelectorAll('.stop'), bus = rail.querySelector('.bus');
  const dk = root.querySelector('.dk'), dv = root.querySelector('.dv'), count = root.querySelector('.count');
  const TRAVEL = 520;
  let cur = -1, at = 0, raf = 0, locked = false, unlock, leaning;
  const go = i => { const t = Math.max(0, Math.min(last, i)); deck.scrollTo({ left: t * deck.clientWidth, behavior: REDUCED() || Math.abs(t - cur) > 1 ? 'auto' : 'smooth' }); };
  const lean = dir => bus.animate([
    { transform: 'none', easing: 'ease-in-out' },
    { transform: `skewX(${8 * dir}deg)`, offset: .3, easing: 'ease-in-out' },
    { transform: `skewX(${-5 * dir}deg)`, offset: .75, easing: 'ease-in-out' },
    { transform: 'none' },
  ], TRAVEL);
  const update = () => {
    raf = 0;
    const i = Math.round(deck.scrollLeft / deck.clientWidth);
    if (i === cur) return;
    cur = i;
    const k = Math.max(0, i - 1), from = at;
    at = k;
    const when = x => { const f = Math.min(1, Math.abs(x - from) / Math.abs(k - from) || 0); return `${Math.round(TRAVEL * (f < .5 ? (f / 8) ** .25 : 1 - (2 - 2 * f) ** .25 / 2))}ms`; };
    slides.forEach((s, j) => s.classList.toggle('on', j === i));
    rail.style.setProperty('--p', k / (N - 1));
    segs.forEach((s, j) => { s.style.transitionDelay = when(k > from ? j : j + 1); s.classList.toggle('done', i > 0 && j < k); });
    stops.forEach((s, j) => { s.style.transitionDelay = `0ms, ${when(j)}`; s.classList.toggle('past', i > 0 && j <= k); });
    if (k !== from && !REDUCED() && leaning?.playState !== 'running') leaning = lean(Math.sign(k - from));
    [dk.textContent, dv.textContent] = i === 0 ? ['Próxima estação', STOPS[0].name] : i === last ? ['Fim de linha', 'Contactos'] : ['Estação', STOPS[k].name];
    if (!REDUCED()) dv.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    count.textContent = `${pad(i + 1)} / ${slides.length}`;
  };
  deck.addEventListener('scroll', () => { raf ||= requestAnimationFrame(update); }, { passive: true });
  root.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-step]');
    if (t) go(t.dataset.go ? +t.dataset.go : cur + +t.dataset.step);
  });
  root.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const s = slides[cur];
    if (e.deltaY > 0 ? s.scrollTop + s.clientHeight < s.scrollHeight - 1 : s.scrollTop > 0) return;
    e.preventDefault();
    clearTimeout(unlock);
    unlock = setTimeout(() => { locked = false; }, 180);
    if (locked || Math.abs(e.deltaY) < 4) return;
    locked = true;
    go(cur + Math.sign(e.deltaY));
  }, { passive: false });
  root.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === ' ' && e.target.closest('button,a')) return;
    const step = { ArrowDown: 1, ArrowRight: 1, PageDown: 1, ' ': e.shiftKey ? -1 : 1, ArrowUp: -1, ArrowLeft: -1, PageUp: -1 }[e.key];
    if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); go(e.key === 'Home' ? 0 : last); }
    else if (step) { e.preventDefault(); go(cur + step); }
  });
  update();
  if (!REDUCED()) bus.animate([{ translate: '-24px 0', opacity: 0 }, { translate: '0 0', opacity: 1 }], { duration: 700, delay: 200, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'backwards' });
}

function liveClock(el) {
  const fmt = new Intl.DateTimeFormat('pt-PT', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit' });
  const tick = () => { el.textContent = fmt.format(new Date()); };
  setInterval(tick, 1000);
  tick();
}

document.getElementById('app').innerHTML = site();
const root = document.querySelector('.site');
initDeck(root);
liveClock(root.querySelector('.clock'));
root.focus({ preventScroll: true });
</script>
</body>
</html>
